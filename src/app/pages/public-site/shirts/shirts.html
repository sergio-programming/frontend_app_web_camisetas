<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    @for (item of shirts; track item._id) {
        <div class="group bg-[#111218] border-2 border-[#1a1c26] shadow-[8px_8px_0px_0px_rgba(26,28,38,1)] hover:shadow-[8px_8px_0px_0px_rgba(99,102,241,1)] transition-all duration-300 flex flex-col">
            
            <div class="p-4 bg-white/5 border-b-2 border-[#1a1c26]">
                <div class="aspect-square bg-white flex items-center justify-center overflow-hidden border-2 border-[#1a1c26]">
                    <img [src]="item.image || 'assets/placeholder-shirt.png'" 
                         [alt]="item.description" 
                         class="w-full h-full object-contain grayscale group-hover:grayscale-0 transition-all duration-500">
                </div>
            </div>

            <div class="p-5 flex flex-col gap-1">
                <h3 class="text-gray-400 font-mono text-[10px] uppercase tracking-[0.2em]">Oficial Merchandise</h3>
                <p class="text-white font-black uppercase italic text-sm leading-tight min-h-[40px]">
                    {{ item.description }}
                </p>
                
                <div class="mt-4 pt-4 border-t border-[#1a1c26] flex justify-between items-center">
                    <span class="text-[#6366f1] font-black text-xl italic">
                        $ {{ item.price }}
                    </span>
                    <button class="w-8 h-8 bg-white text-black flex items-center justify-center hover:bg-[#6366f1] hover:text-white transition-colors shadow-[2px_2px_0px_0px_rgba(99,102,241,1)]">
                        <i class="fas fa-plus text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    }
</div>
