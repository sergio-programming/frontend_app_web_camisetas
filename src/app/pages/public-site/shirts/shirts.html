<div class="w-full px-4 py-12 bg-[#0a0b10] min-h-screen font-sans">
    <div class="max-w-7xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6 border-b-4 border-[#1a1c26] pb-8">
            <div>
                <h2 class="text-5xl font-black text-white uppercase italic tracking-tighter leading-none">
                    Nuestras <span class="text-[#6366f1] drop-shadow-[3px_3px_0_white]">Camisetas</span>
                </h2>
                <p class="text-gray-500 font-mono text-xs mt-4 uppercase tracking-[0.3em]">Catálogo Oficial / Edición Limitada</p>
            </div>
        </div>

        @if (message()) {
            <div class="mb-8 p-6 bg-[#6366f1]/10 border-2 border-[#6366f1] text-white shadow-[8px_8px_0px_0px_rgba(99,102,241,1)]">
                <div class="flex items-center gap-4">
                    <i class="fas fa-info-circle text-2xl"></i>
                    <span class="font-black uppercase italic tracking-widest">{{ message() }}</span>
                </div>
            </div>
        }

        @if (isLoading()) {
            <div class="flex flex-col items-center justify-center py-32">
                <div class="w-20 h-20 border-8 border-[#1a1c26] border-t-[#6366f1] shadow-[4px_4px_0px_0px_rgba(99,102,241,1)] animate-spin"></div>
                <p class="mt-8 text-white uppercase tracking-[0.5em] text-[10px] font-black italic">Sincronizando con el servidor...</p>
            </div>
        } @else {
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
                @for (item of shirts; track item._id) { <div class="group relative bg-[#111218] border-2 border-[#1a1c26] hover:border-[#6366f1] transition-all duration-300 shadow-[8px_8px_0px_0px_rgba(26,28,38,1)] hover:shadow-[8px_8px_0px_0px_rgba(99,102,241,1)] hover:-translate-x-1 hover:-translate-y-1 overflow-hidden flex flex-col">
                        
                        <div class="relative h-64 bg-black overflow-hidden border-b-2 border-[#1a1c26] group-hover:border-[#6366f1]">
                            <img [src]="item.image || 'assets/placeholder-metal.jpg'" 
                                 [alt]="item.description" 
                                 class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-110 transition-all duration-500">
                        </div>

                        <div class="p-6 flex-grow">
                            <h3 class="text-white font-black uppercase italic text-lg leading-tight group-hover:text-[#6366f1] transition-colors mb-2">
                                {{ item.description }}
                            </h3>
                            <p class="text-gray-500 text-xs font-medium line-clamp-2 mb-4">
                                $ {{ item.price }}
                            </p>
                        </div>
                    </div>
                }
            </div>
        }
    </div>
</div>
